<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dennis 的個人名片</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #e2e8f0;
        background:
          radial-gradient(circle at 20% 20%, #312e81 0, transparent 32%),
          radial-gradient(circle at 80% 80%, #0f766e 0, transparent 28%),
          #020617;
      }

      main {
        width: min(100%, 440px);
        padding: 48px 32px;
        text-align: center;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 32px 80px rgba(2, 6, 23, 0.5);
        backdrop-filter: blur(18px);
      }

      .avatar {
        width: 104px;
        height: 104px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 3px solid rgba(165, 180, 252, 0.75);
        border-radius: 999px;
        color: #c7d2fe;
        background: #334155;
        font-size: 30px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        color: #f8fafc;
        font-size: clamp(2rem, 7vw, 2.75rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 12px auto 28px;
        max-width: 32ch;
        color: #94a3b8;
        line-height: 1.7;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        padding: 12px 16px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 12px;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.72);
        font-weight: 650;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      a:hover,
      a:focus-visible {
        border-color: #818cf8;
        background: rgba(49, 46, 129, 0.48);
        transform: translateY(-2px);
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="avatar" aria-label="Dennis 的姓名縮寫">DW</div>
      <h1>Dennis Wang</h1>
      <p>把複雜的教育資料，變成每個人都看得懂、用得上的工具。</p>
      <nav aria-label="社群連結">
        <a href="https://github.com/dennisjyw">GitHub</a>
        <a href="https://www.notion.so/">Notion</a>
        <a href="mailto:hello@example.com">Email</a>
      </nav>
    </main>
  </body>
</html>
